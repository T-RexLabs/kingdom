<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Tileable paper fibre noise for the ludicrous canvas. -->
  <filter id="fibre">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .11 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#fibre)"/>
</svg>
