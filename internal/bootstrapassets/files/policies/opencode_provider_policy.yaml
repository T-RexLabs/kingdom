version: v2
policy_id: opencode-provider-policy-mvp-v2

model_policy:
  fallback_enabled: false
  fallback_strategy: disabled_for_mvp

agent_policy:
  default_agent: advisor
  role_agents:
    operator: governance
    governance: governance
    coordinator: coordinator
    plan-author: plan-author
    architecture-advisor: advisor
    risk-advisor: advisor
    systems-advisor: advisor
    usability-advisor: advisor
    qa-validator: qa-validator
    security-validator: security-validator
    resilience-validator: resilience-validator
    builder: builder
    reviewer: reviewer

timeouts:
  first_event_timeout: 60s
  stream_inactivity_timeout: 10m
  cancel_grace_timeout: 5s
  cancel_force_timeout: 10s
  node_wall_clock:
    advisor_consultation: 8m
    advisory_synthesis: 10m
    plan_drafting: 15m
    delegated_execution: 20m
    validation_gates: 20m

escalation:
  retry_exhausted_target_role: coordinator
  unresolved_strategic_target_role: governance
  dead_letter_required: true
