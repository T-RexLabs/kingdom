version: v2
policy_id: opencode-provider-policy-mvp-v2

model_policy:
  fallback_enabled: false
  fallback_strategy: disabled_for_mvp

agent_policy:
  default_agent: advisor
  role_agents:
    allfather: king
    king: king
    chancellor: chancellor
    council-member: council
    noble-delegate: advisor
    clergy-delegate: advisor
    burgher-delegate: advisor
    peasant-delegate: advisor
    intelligence-qa-scout: qa_scout
    intelligence-nightraven: nightraven
    intelligence-loki-chaos: tester
    builder-berserker: builder
    reviewer-shieldmaiden: reviewer

timeouts:
  strict_startup_total_timeout: 90s
  dispatch_ack_timeout: 5s
  first_event_timeout: 60s
  stream_inactivity_timeout: 10m
  cancel_grace_timeout: 5s
  cancel_force_timeout: 10s
  node_wall_clock:
    advisor_consultation: 8m
    advisory_synthesis: 10m
    plan_drafting: 15m
    delegated_execution: 20m
    validation_gates: 20m

escalation:
  retry_exhausted_target_role: chancellor
  unresolved_strategic_target_role: king
  dead_letter_required: true
