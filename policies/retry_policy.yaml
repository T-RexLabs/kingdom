version: v1
policy_id: retry-policy-mvp-v1

defaults:
  jitter_mode: full

classes:
  transient_transport_provider_session:
    max_retries: 3
    backoff:
      initial_delay: 1s
      multiplier: 2.0
      max_delay: 30s
    escalation:
      on_exhausted: dead_letter
      target_role: chancellor

  internal_runtime:
    max_retries: 1
    backoff:
      initial_delay: 2s
      multiplier: 1.0
      max_delay: 2s
    escalation:
      on_exhausted: dead_letter
      target_role: chancellor

  conditional_limited:
    max_retries: 1
    backoff:
      initial_delay: 2s
      multiplier: 2.0
      max_delay: 10s
    escalation:
      on_exhausted: dead_letter
      target_role: chancellor

  non_retryable:
    max_retries: 0
    escalation:
      on_failure: immediate
      target_role: chancellor

error_code_map:
  transient_transport: transient_transport_provider_session
  timeout: transient_transport_provider_session
  llm_rate_limited: transient_transport_provider_session
  llm_model_unavailable: transient_transport_provider_session
  session_lease_expired: transient_transport_provider_session
  container_start_failed: transient_transport_provider_session

  agent_unresponsive: conditional_limited
  container_oom_killed: conditional_limited
  tool_execution_failed: conditional_limited
  idempotency_pending: conditional_limited

  invalid_output_schema: non_retryable
  policy_violation: non_retryable
  idempotency_conflict: non_retryable
  idempotency_key_expired: non_retryable
  dependency_blocked: non_retryable
  llm_invalid_response: non_retryable
  provider_incomplete_turn: non_retryable
  provider_empty_output: non_retryable
  provider_unknown_failure: non_retryable
  provider_cancelled: non_retryable

  budget_exceeded: non_retryable
  resource_limit_exceeded: non_retryable
  event_sequence_gap: non_retryable
  llm_context_overflow: non_retryable
  internal_error: internal_runtime
