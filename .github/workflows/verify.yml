name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOMAXPROCS: '2'
      KINGDOM_GITHUB_LIVE_SMOKE: '0'
      KINGDOM_LIVE_OPENCODE_SECURITY_TEST: '0'
      KINGDOM_INSTALLED_BROWSER_FIXTURE: '0'
      KINGDOM_REPOSITORY_MANAGED_ACCEPTANCE: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read Tool Versions
        id: versions
        run: |
          awk '$1 == "go" {print "go=" $2} $1 == "nodejs" {print "node=" $2} $1 == "pnpm" {print "pnpm=" $2}' .tool-versions >> "$GITHUB_OUTPUT"
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm }}
          package_json_file: web/package.json
          run_install: false
      - name: Record Environment
        run: |
          mkdir -p kd-sandbox/ci-verify
          {
            git rev-parse HEAD
            uname -a
            go version
            node --version
            pnpm --version
            python3 --version
            make tool-versions
          } 2>&1 | tee kd-sandbox/ci-verify/environment.log
      - name: Verify and Build Entrypoints
        run: |
          set -o pipefail
          make verify build build-central scripts-check PNPM=pnpm 2>&1 | tee kd-sandbox/ci-verify/verify.log
          git diff --exit-code
      - name: Check Central and Account Races
        run: |
          set -o pipefail
          go test -race ./internal/central/... ./internal/subscription/chatgpt/... 2>&1 | tee kd-sandbox/ci-verify/central-race.log
      - name: Collect Coverage Evidence
        if: always()
        run: |
          mkdir -p kd-sandbox/ci-verify
          if test -f .tmp/core.cover.out; then
            cp .tmp/core.cover.out kd-sandbox/ci-verify/core.cover.out
          fi
      - name: Upload Verification Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-${{ matrix.os }}-${{ github.sha }}
          path: kd-sandbox/ci-verify/
          if-no-files-found: error
          retention-days: 14
