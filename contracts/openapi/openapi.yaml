openapi: 3.0.3
info:
  title: Kingdom API
  version: 0.2.0
  description: >-
    Authenticated runtime API. Collection page sizes bound individual reads,
    not the amount of durable history available through continuation cursors.
  license:
    name: Proprietary
    url: https://kingdom.local/license
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Default direct-loopback runtime. Remote bearer access uses the operator-configured HTTPS address.
security:
  - BearerAuth: []
  - BrowserSession: []
paths:
  /auth/session:
    post:
      tags: [auth]
      operationId: createAuthSession
      summary: Create or reuse a browser session from a direct loopback request.
      description: Available only to an exact same-origin browser request whose immediate peer and Host are loopback. The operation accepts no query or request body.
      security: []
      parameters:
        - $ref: "#/components/parameters/BrowserBootstrap"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Existing browser session reused.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "201":
          description: Browser session created.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /mutation-outcomes/{key}:
    get:
      tags: [auth]
      operationId: getMutationOutcome
      summary: Read the retained outcome of an allowlisted operator mutation.
      description: Authenticated readback of the original local operator's nonsecret result, including after browser-session replacement. This does not authorize replay under another authentication binding. Unknown means no authoritative result is retained and does not make a fresh retry safe. Credentials and response headers are never returned.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [planning-session-create, planning-operation-create, planning-session-update, planning-session-delete, planning-context-refresh, planning-message-activate, planning-source-attach, external-source-refresh, external-source-adopt, external-source-detach, theme-source-save, theme-source-delete, theme-publish, theme-unpublish, theme-import, work-order-create, run-create]
      responses:
        "200":
          description: Retained mutation outcome, or an explicit unknown result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationOutcome"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List saved external-source connections without credential material.
      responses:
        "200":
          description: Saved connections.
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionList" } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [connections]
      operationId: createConnection
      summary: Save GitHub App installation metadata.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateConnectionRequest" } } }
      responses:
        "201":
          description: Connection created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows:
    get:
      tags: [connections]
      operationId: getCurrentGitHubManifestFlow
      summary: Resume the active restart-scoped GitHub manifest flow bound to this browser session and origin.
      responses:
        "200": { description: Current safe flow status., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubManifestFlowStatus" } } } }
        "204": { description: No active flow is bound to this browser session and origin. }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [connections]
      operationId: startGitHubManifestFlow
      summary: Start user-owned GitHub App manifest registration or resume the same intent for this exact browser session and origin.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartGitHubManifestFlowRequest" } } }
      responses:
        "200": { description: Safe status for an existing flow with the same owner intent., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubManifestFlowStatus" } } } }
        "201": { description: Transient GitHub form action and manifest. The response is replayable only within the current process and is never persisted., content: { application/json: { schema: { $ref: "#/components/schemas/StartGitHubManifestFlowPayload" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/setup-options:
    get:
      tags: [connections]
      operationId: getGitHubSetupOptions
      summary: Report whether this local runtime has the public shared GitHub App configured.
      responses:
        "200": { description: Safe setup options., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubSetupOptions" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/device-flows:
    get:
      tags: [connections]
      operationId: getCurrentGitHubDeviceFlow
      summary: Discover the unfinished shared-App flow bound to this browser session and exact origin.
      responses:
        "200": { description: Current safe flow status., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeviceFlowStatus" } } } }
        "204": { description: No unfinished flow is bound to this browser session and origin. }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [connections]
      operationId: startGitHubDeviceFlow
      summary: Start restart-scoped GitHub device authorization bound to this browser session and exact origin.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartGitHubDeviceFlowRequest" } } }
      responses:
        "200": { description: Existing unfinished flow for the same binding and intent., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeviceFlowStatus" } } } }
        "201": { description: Safe device authorization instructions without provider device or token secrets., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeviceFlowStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/device-flows/{id}:
    get:
      tags: [connections]
      operationId: getGitHubDeviceFlow
      summary: Read safe status for a shared-App flow bound to this browser and origin.
      parameters:
        - $ref: "#/components/parameters/DeviceFlowId"
      responses:
        "200": { description: Safe flow status., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeviceFlowStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [connections]
      operationId: discardGitHubDeviceFlow
      summary: Discard an unfinished shared-App flow bound to this browser session and exact origin.
      description: Clears memory-only provider authorization and token state. A flow with provider or durable work in flight conflicts until that work settles.
      parameters:
        - $ref: "#/components/parameters/DeviceFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Flow discarded. }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/device-flows/{id}/poll:
    post:
      tags: [connections]
      operationId: pollGitHubDeviceFlow
      summary: Perform one server-paced provider device authorization poll.
      parameters:
        - $ref: "#/components/parameters/DeviceFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Safe flow status., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeviceFlowStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/device-flows/{id}/candidates:
    post:
      tags: [connections]
      operationId: refreshGitHubDeviceCandidates
      summary: Re-fetch exact eligible installations after the user installs the App without reauthorizing.
      parameters:
        - $ref: "#/components/parameters/DeviceFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Safe refreshed candidates., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeviceFlowStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/device-flows/{id}/finalize:
    post:
      tags: [connections]
      operationId: finalizeGitHubDeviceFlow
      summary: Re-verify selected installations and atomically finalize a connection, or reauthorize the exact complete saved installation set.
      parameters:
        - $ref: "#/components/parameters/DeviceFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FinalizeGitHubDeviceFlowRequest" } } }
      responses:
        "201": { description: Healthy finalized connection., content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /connections/github/manifest-flows/{id}:
    get:
      tags: [connections]
      operationId: getGitHubManifestFlow
      summary: Read safe status for a flow bound to this browser session and exact origin.
      parameters:
        - $ref: "#/components/parameters/ManifestFlowId"
      responses:
        "200": { description: Safe flow status., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubManifestFlowStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [connections]
      operationId: discardGitHubManifestFlow
      summary: Abandon an unfinished flow bound to this browser session and exact origin.
      description: Discards memory-only flow state and zeroes its transient secrets so abandoned setup stops presenting itself as resumable.
      parameters:
        - $ref: "#/components/parameters/ManifestFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Flow discarded. }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/{id}/conversion:
    post:
      tags: [connections]
      operationId: convertGitHubManifestFlow
      summary: Exchange the one-time manifest code and prepare installation.
      parameters:
        - $ref: "#/components/parameters/ManifestFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Transient installation URL., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubInstallationURL" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/{id}/installation:
    post:
      tags: [connections]
      operationId: getGitHubManifestInstallationURL
      summary: Resume installation for a converted manifest flow.
      parameters:
        - $ref: "#/components/parameters/ManifestFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Transient installation URL., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubInstallationURL" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/{id}/authorization:
    post:
      tags: [connections]
      operationId: authorizeGitHubManifestFlow
      summary: Start explicit temporary GitHub App user authorization with PKCE.
      parameters:
        - $ref: "#/components/parameters/ManifestFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Transient GitHub authorization URL., content: { application/json: { schema: { $ref: "#/components/schemas/GitHubAuthorizationURL" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/{id}/completion:
    post:
      tags: [connections]
      operationId: completeGitHubManifestFlow
      summary: Prove user and App installation ownership and atomically finalize a healthy connection.
      parameters:
        - $ref: "#/components/parameters/ManifestFlowId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "201": { description: Healthy finalized connection., content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/manifest-callback:
    get:
      tags: [connections]
      operationId: receiveGitHubManifestCallback
      summary: Receive a one-time GitHub manifest callback without relying on the browser session cookie.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 32, maxLength: 128 } }
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        "303": { description: Redirect to the stored exact-origin Connections page without callback query data., headers: { Location: { schema: { type: string, format: uri } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/setup-callback:
    get:
      tags: [connections]
      operationId: receiveGitHubSetupCallback
      summary: Record an untrusted claimed installation identity under one-time state authority.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 32, maxLength: 128 } }
        - { name: installation_id, in: query, required: true, schema: { type: string, pattern: "^[1-9][0-9]{0,31}$" } }
        - { name: setup_action, in: query, required: true, schema: { type: string, enum: [install] } }
      responses:
        "303": { description: Redirect to the stored exact-origin Connections page without callback query data., headers: { Location: { schema: { type: string, format: uri } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/github/manifest-flows/oauth-callback:
    get:
      tags: [connections]
      operationId: receiveGitHubOAuthCallback
      summary: Receive a one-time temporary GitHub App OAuth callback without relying on the browser session cookie.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 32, maxLength: 128 } }
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        "303": { description: Redirect to the stored exact-origin Connections page without callback query data., headers: { Location: { schema: { type: string, format: uri } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [connections]
      operationId: getConnection
      summary: Get saved connection metadata and redacted credential state.
      responses:
        "200": { description: Connection, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: Edit metadata or enable or disable a saved connection.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateConnectionRequest" } } }
      responses:
        "200": { description: Updated connection, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Tombstone a connection and remove its local credential.
      description: Tombstone the connection and remove its local key without deleting provenance. This does not uninstall the GitHub App.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Connection removed. }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}/health-checks:
    post:
      tags: [connections]
      operationId: checkConnectionHealth
      summary: Validate App identity, installation state, and exact permissions.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Validated connection, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}/installations:
    put:
      tags: [connections]
      operationId: setConnectionInstallations
      summary: Choose which App installations this connection covers.
      description: >-
        Replaces the set of installations the connection reads from. Every
        installation is proved against the provider before it is stored, and an
        installation already held by another live connection is refused.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetConnectionInstallationsRequest" } } }
      responses:
        "200": { description: Updated connection, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}/installation-candidates:
    get:
      tags: [connections]
      operationId: listConnectionInstallationCandidates
      summary: List the App installations this connection could cover.
      description: >-
        Lists installations the connection's own credential can see, each
        flagged with whether the connection already covers it.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Installation candidates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items: { $ref: "#/components/schemas/GitHubInstallationCandidate" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}/repositories:
    get:
      tags: [connections]
      operationId: listConnectionRepositories
      summary: List repositories currently granted across the connection's installations.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/Cursor"
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200": { description: Installation repositories, content: { application/json: { schema: { $ref: "#/components/schemas/RepositoryPage" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}/repositories/{repositoryId}/issues:
    get:
      tags: [connections]
      operationId: listConnectionIssues
      summary: Browse or search issues in one granted repository.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/Cursor"
        - { name: state, in: query, required: false, schema: { type: string, enum: [open, closed, all], default: open } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200": { description: Issue-only results; pull requests are excluded., content: { application/json: { schema: { $ref: "#/components/schemas/IssuePage" } } } }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        default: { $ref: "#/components/responses/ErrorResponse" }

  /connections/{id}/repositories/{repositoryId}/issues/{number}/preview:
    get:
      tags: [connections]
      operationId: previewConnectionIssue
      summary: Preview an issue without creating durable provenance.
      description: Transient no-store issue preview. This operation creates no durable source or link.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/RepositoryId"
