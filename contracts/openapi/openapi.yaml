    AcpRunActivityResponse:
      type: object
      additionalProperties: false
      required: [items, resume_cursor, direction, remaining_count, range_after_sequence, range_through_sequence, snapshot_through_sequence]
      description: >-
        Immutable observations sorted ascending within each page. An initial read
        returns the latest bounded window. next_cursor walks earlier pages in
        that pinned snapshot, or continues a forward delta page. resume_cursor
        independently reads later deltas after the snapshot high-water mark.
        The covered range is (range_after_sequence, range_through_sequence].
        Preserve unloaded ranges explicitly when merging concurrent history and
        delta pages; a resume cursor does not imply earlier events were loaded.
      properties:
        direction: { type: string, enum: [earlier, later] }
        remaining_count: { type: integer, minimum: 0 }
        range_after_sequence: { type: integer, minimum: 0 }
        range_through_sequence: { type: integer, minimum: 0 }
        snapshot_through_sequence: { type: integer, minimum: 0 }
        next_cursor: { type: string, minLength: 1 }
        resume_cursor: { type: string, minLength: 1 }
        items:
          type: array
          items:
