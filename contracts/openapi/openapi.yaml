  /artifacts/{id}/preview-session:
    post:
      tags: [artifacts]
      operationId: createArtifactPreviewSession
      summary: Create a short-lived browser preview session for a previewable artifact.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactPreviewSessionRequest"
      responses:
        "201":
          description: Preview session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateArtifactPreviewSessionResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /preview/{token}:
    get:
      tags: [artifacts]
      operationId: getArtifactPreviewContent
      summary: Fetch preview root content by token.
      description: Returns inline preview content using the artifact MIME type recorded for the preview session.
      security: []
      parameters:
        - $ref: "#/components/parameters/PreviewToken"
      responses:
        "200":
          description: Preview content bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /preview/{token}/{assetPath}:
    get:
      tags: [artifacts]
      operationId: getArtifactPreviewAssetContent
      summary: Fetch linked preview asset content by token and relative path.
      description: |
        Browser preview HTML may request linked assets under this route.

        `assetPath` is an opaque slash-preserving relative path emitted by the preview content. This route intentionally stays outside the strict request-validation middleware because standard OpenAPI path parameters do not model arbitrary nested asset paths without changing the public browser URL contract.
      security: []
      parameters:
        - $ref: "#/components/parameters/PreviewToken"
        - $ref: "#/components/parameters/PreviewAssetPath"
      responses:
        "200":
          description: Preview asset content bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Stream run events over SSE.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/LastEventId"
        - $ref: "#/components/parameters/Follow"
        - $ref: "#/components/parameters/PollMs"
      responses:
        "200":
          description: Event stream (SSE).
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /metrics/runtime:
    get:
      tags: [metrics]
      operationId: getMetricsRuntime
      summary: Fetch runtime health metrics.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Runtime health metrics payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMetrics"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /dashboard/snapshot:
    get:
      tags: [metrics]
      operationId: getDashboardSnapshot
      summary: Fetch the Throne Room dashboard snapshot.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Dashboard snapshot payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /realm-analytics/snapshot:
    get:
      tags: [metrics]
      operationId: getRealmAnalyticsSnapshot
      summary: Fetch the Realm Analytics page snapshot.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/WindowMinutes"
      responses:
        "200":
          description: Realm Analytics snapshot payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmAnalyticsSnapshot"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /realm-analytics/execution-detail:
    get:
      tags: [metrics]
      operationId: getRealmAnalyticsExecutionDetailSnapshot
      summary: Fetch aggregate execution detail or an exact selected-run snapshot for Realm Analytics.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/WindowMinutes"
        - name: run_id
          in: query
          required: false
          description: When provided, scope execution detail to that exact run regardless of `window_minutes`. `window_minutes` only scopes the aggregate mode used when `run_id` is omitted.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Realm Analytics execution detail snapshot payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmAnalyticsExecutionDetailSnapshot"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    ActorIdHeader:
      type: apiKey
      in: header
      name: X-Actor-Id
    RoleIdHeader:
      type: apiKey
      in: header
      name: X-Role-Id

  parameters:
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    RoleId:
      name: X-Role-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DecreeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeKey:
      name: nodeKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ArtifactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PreviewToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PreviewAssetPath:
      name: assetPath
      in: path
      required: true
      description: Relative preview asset path as emitted by preview content. Browser requests may include nested slash-separated segments.
      schema:
        type: string
        minLength: 1
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunIdQuery:
      name: run_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    WindowMinutes:
      name: window_minutes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 525600
        default: 1440
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RunStateFilter:
      name: state_filter
      in: query
      required: false
      schema:
        type: string
        enum: [pending, running, awaiting_human_decision, succeeded, failed, cancelled]
    RunSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive run search. Matches exact or prefix run ids and token-prefix decree title terms; multi-term queries require all terms.
      schema:
        type: string
        minLength: 1
    Follow:
      name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: false
    PollMs:
      name: poll_ms
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 2000

    PlanningSessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    PlanningOperationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    PlanningMessagesBefore:
      name: before
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1

  responses:
    HealthResponse:
      description: Service health.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    ErrorResponse:
      description: Canonical error response envelope for unexpected or unclassified failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: internal_error
              message: unexpected server error
              retryable: true
              category: core
              details: {}
              correlation_id: api.internal
              occurred_at: "2026-04-30T12:00:00Z"
    BadRequestError:
      description: Canonical validation or request-shape error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: missing Idempotency-Key header
              retryable: false
              category: core
              details: {}
              correlation_id: idempotency-middleware
              occurred_at: "2026-04-30T12:00:00Z"
    UnauthorizedError:
      description: Canonical authentication error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: missing authentication headers
              retryable: false
              category: core
              details: {}
              correlation_id: api.require_actor_headers
              occurred_at: "2026-04-30T12:00:00Z"
    ForbiddenError:
      description: Canonical authorization error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: plan approval endpoint is allfather-only
              retryable: false
              category: core
              details:
                role_id: chancellor
              correlation_id: api.create_plan_approval
              occurred_at: "2026-04-30T12:00:00Z"
    NotFoundError:
      description: Canonical missing-resource error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: dependency_blocked
              message: run not found
              retryable: false
              category: core
              details:
                run_id: run_missing
              correlation_id: api.get_run
              occurred_at: "2026-04-30T12:00:00Z"
    ConflictError:
      description: Canonical state-conflict error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
