  /themes/{id}:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
    delete:
      operationId: removeTheme
      summary: Remove a Shared Theme
      description: Unpublishes the theme; preserves editable source files. Personal selections fall back when their pinned revision is unavailable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "204":
          description: Theme removed.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /themes/{id}/source:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
    get:
      operationId: getThemeSource
      summary: Read Editable Theme Files
      parameters:
        - name: revision
          in: query
          description: Read the original editable source and assets of this immutable revision.
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "200":
          description: Source text and local assets, including diagnostics for invalid external edits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSource"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: saveThemeSource
      summary: Save Editable Theme Files
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeSaveRequest"
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "200":
          description: Saved source; saving does not publish or change personal appearance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSource"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteThemeSource
      summary: Delete Editable Theme Files
      description: Deletes the editable source without unpublishing immutable revisions.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_source_digest]
              properties:
                expected_source_digest:
                  type: string
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "204":
          description: Editable source deleted.
        "413":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /themes/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
    post:
      operationId: publishTheme
      summary: Publish a Shared Theme Revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_source_digest]
              properties:
                expected_source_digest:
                  type: string
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "201":
          $ref: "#/components/responses/ResolvedTheme"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /themes/{id}/revisions/{digest}:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
      - $ref: "#/components/parameters/ThemeDigest"
    get:
      operationId: getThemeRevision
      summary: Read a Pinned Theme Revision
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "200":
          $ref: "#/components/responses/ResolvedTheme"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /themes/{id}/revisions/{digest}/export:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
      - $ref: "#/components/parameters/ThemeDigest"
    get:
      operationId: exportTheme
      summary: Export a Theme Package
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "200":
          description: Validated source and declared local assets.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/ErrorResponse"
  /themes/{id}/revisions/{digest}/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
      - $ref: "#/components/parameters/ThemeDigest"
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
    get:
      operationId: getThemeAsset
      summary: Read a Declared Theme Asset
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "200":
          description: Validated asset bytes with a restrictive content security policy.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Local operator credential read from a protected credential file.
    BrowserSession:
      type: apiKey
      in: header
      name: Cookie
      description: Browser-managed HttpOnly cookie. The concrete cookie name is origin-scoped and starts with `kingdom_session_`; programmatic clients use BearerAuth.
      x-kingdom-cookie-name-prefix: kingdom_session_

  parameters:
    ThemeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    ThemeDigest:
      name: digest
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Versioned mutation key carrying its issue time, bounded TTL, operation scope, and cryptographic nonce. Bundled clients use a 24-hour TTL; servers reject TTLs above seven days and permanently reject expired keys.
      schema:
        type: string
        maxLength: 128
        pattern: '^kd1\.[0-9]+\.[0-9]+\.[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?\.[A-Za-z0-9_-]{22}$'
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated mutations; bearer-authenticated calls omit it.
      schema:
        type: string
        minLength: 1
    BrowserBootstrap:
      name: X-Kingdom-Browser-Bootstrap
      in: header
      required: true
      schema:
        type: string
        enum: ["1"]
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    WorkOrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ConnectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManifestFlowId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    DeviceFlowId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      description: Provider-native repository ID returned by installation discovery.
      schema:
        type: string
        minLength: 1
    SnapshotId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExternalLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeKey:
      name: nodeKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ArtifactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunIdQuery:
      name: run_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    WindowMinutes:
      name: window_minutes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 525600
        default: 1440
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    ActivityEventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ActivityContentField:
      name: field
      in: path
      required: true
      schema: { type: string, enum: [input, output, reasoning, message] }
    ActivityContentLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 4, maximum: 65536, default: 16384 }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RunStateFilter:
      name: state_filter
      in: query
      required: false
      schema:
        type: string
        enum: [pending, running, awaiting_human_decision, succeeded, failed, cancelled]
    RunSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive run search. Matches exact or prefix run ids and token-prefix work order title terms; multi-term queries require all terms.
      schema:
        type: string
        minLength: 1
    Follow:
      name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: false
    PollMs:
      name: poll_ms
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 2000

    PlanningSessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    AcpAgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          [planner-reply, planner-regenerate, planner-formalize, planner-generate-title]

    AcpRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    PlanningMessagesBefore:
      name: before
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1

  responses:
    ResolvedTheme:
      description: Complete resolved presentation package and separate source and resolved identities.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThemePackage"
    HealthResponse:
      description: Service health.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    ErrorResponse:
      description: Canonical error response envelope for unexpected or unclassified failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: internal_error
              message: unexpected server error
              retryable: true
              category: core
              details: {}
              correlation_id: api.internal
              occurred_at: "2026-04-30T12:00:00Z"
    BadRequestError:
      description: Canonical validation or request-shape error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: missing Idempotency-Key header
              retryable: false
              category: core
              details: {}
              correlation_id: idempotency-middleware
              occurred_at: "2026-04-30T12:00:00Z"
    UnauthorizedError:
      description: Canonical authentication error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: authentication required
              retryable: false
              category: core
              details: {}
              correlation_id: api.auth
              occurred_at: "2026-04-30T12:00:00Z"
    ForbiddenError:
      description: Canonical authorization error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: same-origin CSRF validation failed
              retryable: false
              category: core
              details: {}
              correlation_id: api.auth.csrf
              occurred_at: "2026-04-30T12:00:00Z"
    NotFoundError:
      description: Canonical missing-resource error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: dependency_blocked
              message: run not found
              retryable: false
              category: core
              details:
                run_id: run_missing
              correlation_id: api.get_run
              occurred_at: "2026-04-30T12:00:00Z"
    ConflictError:
      description: Canonical state-conflict error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: dependency_blocked
              message: plan transition is not allowed
              retryable: false
              category: core
              details:
                run_id: run_123
              correlation_id: api.create_plan_approval
