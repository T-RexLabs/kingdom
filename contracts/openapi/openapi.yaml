openapi: 3.0.3
info:
  title: Kingdom API
  version: 0.2.0
  license:
    name: Proprietary
    url: https://kingdom.local/license
servers:
  - url: https://api.kingdom.local/api/v1
security:
  - ActorIdHeader: []
    RoleIdHeader: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Read service health status.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /decrees:
    post:
      tags: [decrees]
      operationId: createDecree
      summary: Create a decree entry.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecreeRequest"
      responses:
        "201":
          description: Decree accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDecreeResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /decrees/{id}:
    get:
      tags: [decrees]
      operationId: getDecree
      summary: Get a decree by ID.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/DecreeId"
      responses:
        "200":
          description: Decree details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecreeDetail"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions:
    get:
      tags: [planning]
      operationId: listPlanningSessions
      summary: List planning sessions ordered by recent activity.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Planning sessions ordered by updated time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningSessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [planning]
      operationId: createPlanningSession
      summary: Create a planning session with the first question ready immediately.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanningSessionRequest"
      responses:
        "201":
          description: Planning session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlanningSessionResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}:
    get:
      tags: [planning]
      operationId: getPlanningSession
      summary: Get a planning session by ID.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
      responses:
        "200":
          description: Planning session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [planning]
      operationId: updatePlanningSession
      summary: Update a planning session title or planner model.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanningSessionRequest"
      responses:
        "200":
          description: Updated planning session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [planning]
      operationId: deletePlanningSession
      summary: Delete a planning session and its associated plans, messages, and context snapshots.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Planning session deleted.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/messages:
    get:
      tags: [planning]
      operationId: listPlanningSessionMessages
      summary: List planning session messages as a paginated transcript page.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PlanningMessagesBefore"
      responses:
        "200":
          description: Latest or previous planning session transcript page in ascending display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningMessagesPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/plan:
    get:
      tags: [planning]
      operationId: getPlanningSessionPlan
      summary: Get the current formalized plan for a planning session.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
      responses:
        "200":
          description: Current planning session plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningDraft"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/operations:
    post:
      tags: [planning]
      operationId: createPlanningSessionOperation
      summary: Create a durable planner operation.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanningOperationRequest"
      responses:
        "201":
          description: Planner operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlanningOperationResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-operations/{id}:
    get:
      tags: [planning]
      operationId: getPlanningOperation
      summary: Get planner operation status and result references.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningOperationId"
      responses:
        "200":
          description: Planner operation detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningOperationDetail"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-operations/{id}/events:
    get:
      tags: [planning]
      operationId: streamPlanningOperationEvents
      summary: Stream durable planner operation events with Last-Event-ID resume.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningOperationId"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: SSE stream of durable planner operation events.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/context/refresh:
    post:
      tags: [planning]
      operationId: refreshPlanningSessionContext
      summary: Refresh the sanitized planning context snapshot for a session.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Refreshed planning context snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshPlanningSessionContextResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/generate-title:
    post:
      tags: [planning]
      operationId: generatePlanningSessionTitle
      summary: Auto-generate a title from the conversation so far.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Generated title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePlanningSessionTitleResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/messages/{messageId}/activate:
    put:
      tags: [planning]
      operationId: activatePlanningMessageVariant
      summary: Switch the active variant for a planning message position.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Variant activated. Returns the activated message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningMessage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /planning-sessions/{id}/messages/{messageId}/variants:
    get:
      tags: [planning]
      operationId: listPlanningMessageVariants
      summary: List all variants at the same position as the specified message.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PlanningSessionId"
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: List of variants at this position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningMessageVariantsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /workflows/publish:
    post:
      tags: [workflows]
      operationId: publishWorkflow
      summary: Publish an immutable workflow version.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishWorkflowRequest"
      responses:
        "201":
          description: Workflow version published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishWorkflowResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List canonical agent roles.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Canonical role metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List all registered agents regardless of run association.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: All agents ordered by lineage depth and creation time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /provider/models:
    get:
      tags: [providers]
      operationId: listProviderModels
      summary: List available OpenCode provider models.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Available provider models with display labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModelsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /workspace-capabilities:
    get:
      tags: [system]
      operationId: getWorkspaceCapabilities
      summary: Read publish-mode capabilities for the configured project root.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Workspace capabilities for decree issuance and run creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCapabilities"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List workflow runs with filtering, ranked search, and cursor pagination.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/RunStateFilter"
        - $ref: "#/components/parameters/RunSearch"
      responses:
        "200":
          description: Run summaries ordered by search relevance when searching, otherwise newest-first or by newest activity when filtered to awaiting human decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a workflow run.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/events/stream:
    get:
      tags: [runs]
      operationId: streamRunCollectionEvents
      summary: Stream collection-level run updates over SSE with Last-Event-ID resume.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/LastEventId"
        - $ref: "#/components/parameters/Follow"
        - $ref: "#/components/parameters/PollMs"
      responses:
        "200":
          description: Collection event stream (SSE).
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Fetch run state snapshot.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel an active workflow run.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
      responses:
        "200":
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}/plan:
    get:
      tags: [runs]
      operationId: getRunPlan
      summary: Fetch the latest reviewable current plan snapshot for a run.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Latest reviewable current plan snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPlanSnapshot"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}/plan-reviews:
    get:
      tags: [runs]
      operationId: listRunPlanReviews
      summary: List durable allfather plan review history for a run.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run plan review history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPlanReviewsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}/governance-decisions:
    get:
      tags: [runs]
      operationId: listRunGovernanceDecisions
      summary: List durable allfather governance decision history for a run.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Run governance decision history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceDecisionsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}/artifacts:
    get:
      tags: [runs]
      operationId: listRunArtifacts
      summary: List artifacts produced for a run.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run artifact list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunArtifactsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /runs/{id}/artifacts/archive:
    get:
      tags: [runs]
      operationId: getRunArtifactsArchive
      summary: Download all artifacts for a run as a zip archive.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: ZIP archive containing run artifacts.
