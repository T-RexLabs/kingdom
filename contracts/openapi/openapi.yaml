components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Local operator credential read from a protected credential file.
    BrowserSession:
      type: apiKey
      in: header
      name: Cookie
      description: Browser-managed HttpOnly cookie. The concrete cookie name is origin-scoped and starts with `kingdom_session_`; programmatic clients use BearerAuth.
      x-kingdom-cookie-name-prefix: kingdom_session_

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Versioned mutation key carrying its issue time, bounded TTL, operation scope, and cryptographic nonce. Bundled clients use a 24-hour TTL; servers reject TTLs above seven days and permanently reject expired keys.
      schema:
        type: string
        maxLength: 128
        pattern: '^kd1\.[0-9]+\.[0-9]+\.[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?\.[A-Za-z0-9_-]{22}$'
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated mutations; bearer-authenticated calls omit it.
      schema:
        type: string
        minLength: 1
    BrowserBootstrap:
      name: X-Kingdom-Browser-Bootstrap
      in: header
      required: true
      schema:
        type: string
        enum: ["1"]
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DecreeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ConnectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManifestFlowId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    DeviceFlowId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      description: Provider-native repository ID returned by installation discovery.
      schema:
        type: string
        minLength: 1
    SnapshotId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExternalLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeKey:
      name: nodeKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ArtifactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunIdQuery:
      name: run_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    WindowMinutes:
      name: window_minutes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 525600
        default: 1440
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RunStateFilter:
      name: state_filter
      in: query
      required: false
      schema:
        type: string
        enum: [pending, running, awaiting_human_decision, succeeded, failed, cancelled]
    RunSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive run search. Matches exact or prefix run ids and token-prefix decree title terms; multi-term queries require all terms.
      schema:
        type: string
        minLength: 1
    Follow:
      name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: false
    PollMs:
      name: poll_ms
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 2000

    PlanningSessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    PlanningOperationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    AcpAgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          [planner-reply, planner-regenerate, planner-formalize, planner-generate-title]

    AcpRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    PlanningMessagesBefore:
      name: before
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1

  responses:
    HealthResponse:
      description: Service health.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    ErrorResponse:
      description: Canonical error response envelope for unexpected or unclassified failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: internal_error
              message: unexpected server error
              retryable: true
              category: core
              details: {}
              correlation_id: api.internal
              occurred_at: "2026-04-30T12:00:00Z"
    BadRequestError:
      description: Canonical validation or request-shape error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: missing Idempotency-Key header
              retryable: false
              category: core
              details: {}
              correlation_id: idempotency-middleware
              occurred_at: "2026-04-30T12:00:00Z"
    UnauthorizedError:
      description: Canonical authentication error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: authentication required
              retryable: false
              category: core
              details: {}
              correlation_id: api.auth
              occurred_at: "2026-04-30T12:00:00Z"
    ForbiddenError:
      description: Canonical authorization error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: policy_violation
              message: same-origin CSRF validation failed
              retryable: false
              category: core
              details: {}
              correlation_id: api.auth.csrf
              occurred_at: "2026-04-30T12:00:00Z"
    NotFoundError:
      description: Canonical missing-resource error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: dependency_blocked
              message: run not found
              retryable: false
              category: core
              details:
                run_id: run_missing
              correlation_id: api.get_run
              occurred_at: "2026-04-30T12:00:00Z"
    ConflictError:
      description: Canonical state-conflict error response envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: dependency_blocked
              message: plan transition is not allowed
              retryable: false
              category: core
              details:
                run_id: run_123
              correlation_id: api.create_plan_approval
              occurred_at: "2026-04-30T12:00:00Z"
    ServiceUnavailableError:
      description: Canonical transient dependency or runtime availability error response envelope.
      content:
        application/json:
          schema:
