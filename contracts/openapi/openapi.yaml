                  format: byte
                  maxLength: 45088768
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "200":
          $ref: "#/components/responses/ResolvedTheme"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /themes/import:
    post:
      operationId: importTheme
      summary: Import a Theme Package
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archive]
              properties:
                archive:
                  type: string
                  format: byte
                  maxLength: 45088768
      responses:
        "400": { $ref: "#/components/responses/BadRequestError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "201":
