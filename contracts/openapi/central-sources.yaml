openapi: 3.1.0
info:
  title: Kingdom Initial Project Input
  version: 1.0.0
  license: {name: Proprietary, url: 'https://kingdom.local/license'}
servers:
  - url: /
    description: Operator-configured central HTTPS origin.
security: [{session: []}]
paths:
  /api/central/v1/projects/{project}/source:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getInitialProjectSource
      summary: Read Initial Project Input Status
      responses:
        '200':
          description: Current input status.
          content:
            application/json:
              schema:
                type: object
                required: [state, can_upload]
                properties:
                  state: {type: string, enum: [empty, imported, started]}
                  can_upload: {type: boolean, description: Current actor can set initial input.}
                  source: {$ref: '#/components/schemas/Source'}
        '401': {description: Session required.}
        '403': {description: Project access denied.}
        '503': {description: Input service unavailable.}
  /api/central/v1/projects/{project}/source/{kind}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [zip, file]}
    post:
      operationId: uploadInitialProjectSource
      summary: Set Immutable Initial Project Files
      description: Requires project-owner authority, same-origin CSRF protection, and no previous source or runtime startup. Kind zip uses application/zip; kind file uses application/octet-stream and name.
      parameters:
        - name: name
          in: query
          schema: {type: string}
          description: Required relative filename for a single-file upload.
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/zip:
            schema: {type: string, format: binary}
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Immutable initial input selected, or exact prior result replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '400': {description: Invalid or unsupported input.}
        '401': {description: Session required.}
        '403': {description: Project-owner or CSRF authorization denied.}
        '409': {description: Initial input fixed or retry payload conflict.}
        '503': {description: Outcome unavailable; retain the exact retry request.}
  /api/central/v1/projects/{project}/repository:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getProjectRepository
      summary: Read Configured Repository Access
      responses:
        '200':
          description: Operator-selected repository grant.
          content:
            application/json:
              schema:
                type: object
                required: [available, can_publish]
                properties:
                  available: {type: boolean}
                  repository_id: {type: integer, format: int64, minimum: 1}
                  can_publish: {type: boolean}
        '401': {description: Session required.}
        '403': {description: Project access denied.}
        '503': {description: Repository service unavailable.}
  /api/central/v1/projects/{project}/repository/import:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: importProjectRepository
      summary: Import Initial Repository Files
      description: Requires project-owner and CSRF authority. The retry key pins the resolved commit before import. No replacement after initial input or startup.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref]
              properties:
                ref: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Verified repository input selected or replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '400': {description: Invalid or unsupported repository input.}
        '401': {description: Session required.}
        '403': {description: 'Project-owner, repository grant, or CSRF authorization denied.'}
        '409': {description: Initial input fixed or retry payload conflict.}
        '503': {description: Outcome unavailable; retain the exact retry request.}
  /api/central/v1/projects/{project}/repository/publish:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: publishProjectResult
      summary: Publish a Verified Result to GitHub
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_id, base_branch, title, body]
              properties:
                run_id: {type: string, minLength: 1}
                base_branch: {type: string, minLength: 1, maxLength: 200}
                title: {type: string, minLength: 1, maxLength: 200}
                body: {type: string, maxLength: 8192}
      responses:
        '200':
          description: Published or no file changes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '202':
          description: Saved submission remains pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '400': {description: Invalid or unsupported result.}
        '401': {description: Session required.}
        '403': {description: 'Project-owner, publication grant, or CSRF denied.'}
        '409': {description: Request identity or upstream baseline conflict.}
        '503': {description: Outcome unconfirmed; recover the saved request.}
  /api/central/v1/projects/{project}/repository/publications:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listResultPublications
      summary: List Your Saved Result Publications
      parameters:
        - name: run_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: At most 100 actor-owned publication records for this run.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Publication'}
        '400': {description: Run ID required.}
        '401': {description: Session required.}
        '403': {description: Project-owner access denied.}
        '503': {description: Repository service unavailable.}
  /api/central/v1/projects/{project}/repository/publications/{publication}/reconcile:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: publication
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: reconcileResultPublication
      summary: Recover Your Saved Publication
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current exact publication outcome.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '401': {description: Session required.}
        '403': {description: 'Actor, project-owner, publication grant, or CSRF denied.'}
        '409': {description: Retained request or upstream baseline conflict.}
        '503': {description: Outcome remains unconfirmed.}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-kingdom-session}
  parameters:
    Project:
      name: project
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Publication:
      type: object
      required: [state]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [pending, published, unchanged]}
        branch: {type: string}
        pull_request: {type: integer, format: int64, minimum: 1}
        url: {type: string, format: uri}
    Source:
      type: object
      required: [id, kind, files, bytes, sha256]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [zip, file, github]}
        files: {type: integer, minimum: 0}
        bytes: {type: integer, format: int64, minimum: 0}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        repository:
          type: object
          required: [repository_id, commit_sha, tree_sha]
          properties:
            repository_id: {type: integer, format: int64, minimum: 1}
            commit_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
            tree_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
